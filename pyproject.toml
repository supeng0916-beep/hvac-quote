[project]
name = "hvac-quote"
version = "0.1.0"
description = "CAD-assisted HVAC quotation workspace"
requires-python = ">=3.12"
dependencies = [
    "ezdxf==1.4.3",
    "openpyxl>=3.1.5",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.8",
    "reportlab>=4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "httpx>=0.27",
    "pymupdf>=1.24",
]

[project.scripts]
hvac-quote = "hvac_quote.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hvac_quote", "src/hvac_cad"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:ezdxf.*",
    "ignore::DeprecationWarning:pyparsing.*",
    "ignore::DeprecationWarning:pymupdf.*",
    "ignore::DeprecationWarning:fastapi.testclient",
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
]
